# Mantiene activo el proyecto gratuito de Supabase (se pausa tras 7 días sin uso).
# Hace una consulta mínima cada 3 días. No lee ningún dato: las reglas de
# seguridad devuelven una lista vacía a quien no ha iniciado sesión.
name: Mantener Supabase activo
on:
  schedule:
    - cron: '17 8 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta mínima a Supabase
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://ecldbrggyisfjsmbozgf.supabase.co/rest/v1/households?select=id&limit=1" \
            -H "apikey: sb_publishable_enmJ2sZr_kiNoPky1xsl3w_5PvcaRRy"
