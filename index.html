<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1F5C46" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Presupuesto" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Presupuesto Familiar</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (e) {
        var r = document.getElementById('root');
        if (r && !r.children.length) {
          r.innerHTML = '<div style="padding:24px;font-family:system-ui;color:#B23A2B"><b>Error al iniciar la app:</b><br></div>';
          r.firstChild.appendChild(document.createTextNode(String(e.message || e.error)));
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
